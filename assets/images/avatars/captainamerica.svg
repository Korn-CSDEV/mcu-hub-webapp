<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="capBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#102542"/>
      <stop offset="100%" stop-color="#080F1E"/>
    </radialGradient>
    <filter id="shieldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00A2FF" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#capBg)" stroke="#0080FF" stroke-width="3"/>
  <!-- Outer Red Ring -->
  <circle cx="100" cy="100" r="75" fill="#ED1D24" filter="url(#shieldShine)"/>
  <!-- White Ring -->
  <circle cx="100" cy="100" r="60" fill="#E8ECEF"/>
  <!-- Inner Red Ring -->
  <circle cx="100" cy="100" r="45" fill="#ED1D24"/>
  <!-- Blue Center -->
  <circle cx="100" cy="100" r="30" fill="#0D47A1"/>
  <!-- Star in Center -->
  <polygon points="100,75 106,89 122,89 109,99 114,114 100,105 86,114 91,99 78,89 94,89" fill="#FFFFFF"/>
</svg>