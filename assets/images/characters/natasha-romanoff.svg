<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="widowBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#232733"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </radialGradient>
    <filter id="widowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ED1D24" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#widowBg)" stroke="#ED1D24" stroke-width="3"/>
  <!-- Outer tactical frame -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#333A4D" stroke-width="3"/>
  <circle cx="100" cy="100" r="74" fill="#141822"/>
  <!-- Red Hourglass Emblem -->
  <polygon points="65,55 135,55 100,96" fill="#ED1D24" filter="url(#widowGlow)"/>
  <polygon points="65,145 135,145 100,104" fill="#ED1D24" filter="url(#widowGlow)"/>
  <!-- Center connecting node -->
  <rect x="94" y="96" width="12" height="8" fill="#B30006"/>
  <!-- Tactical bite stun darts -->
  <circle cx="48" cy="100" r="5" fill="#00E5FF"/>
  <circle cx="152" cy="100" r="5" fill="#00E5FF"/>
</svg>