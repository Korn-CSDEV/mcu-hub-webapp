<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="strangeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="100%" stop-color="#090D15"/>
    </radialGradient>
    <filter id="timeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#00E676" flood-opacity="0.9"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#strangeBg)" stroke="#F5A623" stroke-width="3"/>
  <!-- Cloak Collar Silhouette -->
  <path d="M45 160 L60 90 L100 130 L140 90 L155 160 Z" fill="#B71C1C" stroke="#7F0000" stroke-width="2"/>
  <!-- Eye of Agamotto Amulet -->
  <ellipse cx="100" cy="115" rx="38" ry="24" fill="#F5A623" stroke="#8C5300" stroke-width="2.5"/>
  <ellipse cx="100" cy="115" rx="28" ry="17" fill="#2E1C0C"/>
  <!-- Time Stone Eye inside -->
  <ellipse cx="100" cy="115" rx="16" ry="10" fill="#00E676" filter="url(#timeGlow)"/>
  <circle cx="100" cy="115" r="4" fill="#FFFFFF"/>
  <!-- Eldritch Magic Ring Circles -->
  <circle cx="100" cy="115" r="55" fill="none" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="8,4" stroke-opacity="0.5"/>
</svg>