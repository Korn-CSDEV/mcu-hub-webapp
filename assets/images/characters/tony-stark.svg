<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgIron" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D1115"/>
      <stop offset="100%" stop-color="#0E0709"/>
    </radialGradient>
    <linearGradient id="armorRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED1D24"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>
    <linearGradient id="goldFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#C78100"/>
    </linearGradient>
    <filter id="arcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00F0FF" flood-opacity="0.9"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#bgIron)" stroke="#ED1D24" stroke-width="3"/>
  <!-- Helmet base -->
  <path d="M50 70 C50 35 70 25 100 25 C130 25 150 35 150 70 L150 135 C150 160 135 175 100 178 C65 175 50 160 50 135 Z" fill="url(#armorRed)"/>
  <!-- Gold Faceplate -->
  <polygon points="70,55 130,55 140,85 132,135 118,155 82,155 68,135 60,85" fill="url(#goldFace)" stroke="#7A4B00" stroke-width="1.5"/>
  <!-- Brow line -->
  <polygon points="75,85 100,92 125,85 130,75 70,75" fill="#800000"/>
  <!-- Glowing Eyes -->
  <polygon points="74,98 92,100 90,105 76,104" fill="#FFFFFF" filter="url(#arcGlow)"/>
  <polygon points="126,98 108,100 110,105 124,104" fill="#FFFFFF" filter="url(#arcGlow)"/>
  <!-- Mouth slit -->
  <line x1="88" y1="140" x2="112" y2="140" stroke="#7A4B00" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>