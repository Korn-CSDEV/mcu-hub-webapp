<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="mcuRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED1D24"/>
      <stop offset="100%" stop-color="#B80006"/>
    </linearGradient>
    <filter id="mcuGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ED1D24" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Box -->
  <rect x="10" y="10" width="480" height="100" rx="4" fill="url(#mcuRedGrad)" filter="url(#mcuGlow)"/>
  <rect x="14" y="14" width="472" height="92" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- MARVEL Text in bold heavy grotesque style -->
  <g fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="70" letter-spacing="2">
    <text x="250" y="74" text-anchor="middle">MARVEL</text>
  </g>
  
  <!-- STUDIOS Subtitle with line rules -->
  <line x1="28" y1="84" x2="135" y2="84" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="250" y="100" fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" letter-spacing="12" text-anchor="middle">STUDIOS</text>
  <line x1="365" y1="84" x2="472" y2="84" stroke="#FFFFFF" stroke-width="2.5"/>
</svg>
